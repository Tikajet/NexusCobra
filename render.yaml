services:
  # 1. Backend Web Service (Node.js)
  - type: web
    name: nexus-cob-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-cob-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site
  - type: web
    name: nexus-cob-app
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Banco de Dados PostgreSQL
  - name: nexus-cob-db
    region: oregon
    plan: free
