services:
  # 1. Backend API Service (Node.js)
  - type: web
    name: nexus-cob-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000

  # 2. Frontend Static Site (React/Vite)
  - type: web
    name: nexus-cob-app
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Banco de Dados PostgreSQL
  - name: nexus-cob-db
    region: oregon
    plan: free
